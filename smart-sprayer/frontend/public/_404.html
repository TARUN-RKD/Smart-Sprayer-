<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Smart Sprayer</title>
  <script>
    // Store the path that triggered 404 and redirect to index
    // This allows React Router to handle client-side routing
    const path = location.pathname.replace('/Smart-Sprayer-/', '/');
    sessionStorage.setItem('redirect', path);
    // Redirect to index.html which will be served at /Smart-Sprayer-/
    window.location.replace('/Smart-Sprayer-/#' + path);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
